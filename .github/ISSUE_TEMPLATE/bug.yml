name: Bug or documentation defect
description: Report a contradiction, broken docs page, or reproducible tooling defect.
body:
  - type: markdown
    attributes:
      value: |
        **Pre-implementation: no usable SDK or validated wallet runtime.**

        Do not submit credentials, mnemonics, keys, wallet identifiers, addresses, txids, PCZTs, database contents, or sensitive logs. Use synthetic examples and placeholder URLs/paths only.
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Link the document or proposed declaration and describe expected versus actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Give minimal steps and safe environment/version categories. There is no SDK release yet.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe report
      options:
        - label: "I used synthetic data and excluded all sensitive material listed above."
          required: true
