[package]
name = "transaction-codec-qualification"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
zcash_primitives = { package = "zakura-primitives", version = "=1.0.0", default-features = false, features = ["std"] }
zcash_protocol = { version = "=0.10.6", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
hex = "=0.4.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
